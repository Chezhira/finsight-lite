[project]
name = "finsight-lite"
version = "0.1.0"
description = "AI finance intelligence dashboard for validated finance models and CFO-style commentary."
requires-python = ">=3.10"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]
